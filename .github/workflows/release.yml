name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release, e.g. 2.0.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    # The app targets macOS 26 and builds for arm64, so it needs a runner
    # on the same release.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: brew install glib gettext openssl@3

      # Xcode reads BuildNumber.xcconfig when the build starts, while the
      # Prebuild phase rewrites it during the build, so the version it stamps
      # is always one build behind. Generating it first means the tag being
      # released is the version that ships.
      - name: Stamp the version
        run: |
          tools/gen_buildnum_h.pl build_number.h BuildNumber.xcconfig
          cat BuildNumber.xcconfig

      # Xcode reads the configuration files before any build phase runs, so
      # this has to happen before xcodebuild rather than inside it.
      - name: Point the perl plugin at this machine's perl
        run: |
          tools/gen_perl_xcconfig.sh Perl.xcconfig
          cat Perl.xcconfig

      - name: Build
        run: |
          xcodebuild \
            -project XChatAqua.xcodeproj \
            -scheme 'XChat Cerulean' \
            -configuration Release \
            -derivedDataPath build \
            build

      # The app links glib, gettext and OpenSSL from Homebrew by absolute
      # path, so without this a downloaded build only runs on a machine that
      # has the same formulae installed.
      - name: Bundle the libraries into the app
        run: ./tools/bundle_libs.sh "build/Build/Products/Release/XChat Cerulean.app"

      # Rewriting the load commands invalidates the signatures the libraries
      # came with, and --deep does not reliably reach nested code, so each
      # piece is signed from the inside out.
      - name: Sign
        run: ./tools/sign_app.sh "build/Build/Products/Release/XChat Cerulean.app"

      - name: Package
        run: |
          APP="build/Build/Products/Release/XChat Cerulean.app"
          ditto -c -k --keepParent "$APP" "XChat-Cerulean-${{ steps.version.outputs.value }}.zip"
          shasum -a 256 "XChat-Cerulean-${{ steps.version.outputs.value }}.zip" \
            > "XChat-Cerulean-${{ steps.version.outputs.value }}.zip.sha256"

      - name: Take the notes from the changelog
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          cat >> notes.md <<'EOF'

          ---

          The app is signed ad-hoc rather than with a Developer ID, so the
          first launch needs Control-click → Open, or:

          ```
          xattr -dr com.apple.quarantine "/Applications/XChat Cerulean.app"
          ```

          glib, gettext and OpenSSL are bundled inside the app under their own
          licences; see COPYING and the credits in the README.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: XChat-Cerulean-${{ steps.version.outputs.value }}
          path: XChat-Cerulean-${{ steps.version.outputs.value }}.zip*

      # Sparkle checks this feed. Updates are signed with EdDSA because an
      # ad-hoc code signature gives it nothing stable to verify against.
      - name: Build the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TOOLS="$(find build/SourcePackages/artifacts -type d -name bin -path '*Sparkle*' | head -1)"
          [ -n "$TOOLS" ] || { echo "Sparkle tools not found" >&2; exit 1; }

          mkdir -p appcast-in && cp "XChat-Cerulean-$VERSION.zip" appcast-in/
          printf '%s' "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle.key

          # generate_appcast embeds an .html file sitting beside the archive
          # as that version's release notes, so what the update dialog shows
          # is this version's changelog section.
          python3 tools/changelog_to_html.py "$VERSION" \
            > "appcast-in/XChat-Cerulean-$VERSION.html"

          "$TOOLS/generate_appcast" \
            --ed-key-file /tmp/sparkle.key \
            --embed-release-notes \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$VERSION/" \
            --link "https://github.com/${{ github.repository }}" \
            appcast-in

          rm -f /tmp/sparkle.key
          cp appcast-in/appcast.xml docs/appcast.xml
          echo "--- appcast ---"; cat docs/appcast.xml

      - name: Publish the appcast to the site
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin main
          # The build rewrites the version stamp and the perl configuration,
          # and a plain checkout refuses to run over them. They have served
          # their purpose by this point, so they are discarded.
          git checkout -f main
          cp appcast-in/appcast.xml docs/appcast.xml
          # Staged first: a file that is new to the tree shows no diff at all,
          # so testing before adding would skip the very first publication.
          git add docs/appcast.xml
          if ! git diff --cached --quiet -- docs/appcast.xml; then
            git commit -m "Update the appcast for ${{ steps.version.outputs.value }}"
            git push origin main
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          gh release create "$VERSION" \
            --title "XChat Cerulean $VERSION" \
            --notes-file notes.md \
            "XChat-Cerulean-$VERSION.zip" \
            "XChat-Cerulean-$VERSION.zip.sha256"
